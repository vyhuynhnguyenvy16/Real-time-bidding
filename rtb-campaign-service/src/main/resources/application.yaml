spring:
  application:
    name: rtb-campaign-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rtb}
    username: ${DB_USER:rtb}
    password: ${DB_PASSWORD}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Money must never be cut silently: 100000000.9 is a 400, not 100000000.
      accept-float-as-int: false

server:
  port: ${PORT:8080}

rtb:
  security:
    # HS256 secret, at least 32 bytes. No default on purpose: the service must not start without it.
    jwt-secret: ${JWT_SECRET}
  outbox:
    relay:
      # Off by default; the deployed service turns it on and points it at Kafka.
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: campaign-updates
